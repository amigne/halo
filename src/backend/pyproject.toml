[project]
name = "halo-api"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0.50",
    "alembic",
    "psycopg[binary]",
    "aiosqlite",
    "redis",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "mypy>=1.19",
    "pytest>=8.4",
    "pytest-asyncio>=0.26",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["halo_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.14"
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
