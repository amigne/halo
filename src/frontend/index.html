<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halo</title>
    <script>
      // Anti-flash language (U-100): set <html lang> before first paint
      (function () {
        var lang = localStorage.getItem("halo.lang");
        if (!lang) {
          var nav = (navigator.language || "").split("-")[0].toLowerCase();
          lang = nav === "fr" || nav === "en" ? nav : "en";
        }
        document.documentElement.lang = lang;
      })();
    </script>
    <script>
      // Anti-flash theme (U-092): apply theme before first paint
      (function () {
        var stored = localStorage.getItem("halo.theme");
        var theme =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system";
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
