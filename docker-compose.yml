# Halo — Docker Compose production (T-150)
#
# Usage:
#   cp .env.example .env   # then edit .env with real values
#   docker compose up -d
#
# Services:
#   proxy     — Caddy reverse proxy on :80
#   frontend  — Nginx + built SPA assets
#   backend   — Uvicorn (production, no reload)
#   worker    — Background task placeholder
#   db        — Postgres 18
#   redis     — Redis 8.8

services:
  # ── Caddy reverse proxy ────────────────────────────────────────────────────
  proxy:
    image: caddy:2-alpine
    container_name: halo-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - halo_caddy_data:/data
      - halo_caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── Frontend (Nginx + built assets) ────────────────────────────────────────
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: halo-frontend:latest
    container_name: halo-frontend
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── Backend (Uvicorn production) ───────────────────────────────────────────
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: halo-backend:latest
    container_name: halo-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-halo}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── Worker (placeholder — no business logic yet) ────────────────────────────
  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: halo-backend:latest
    container_name: halo-worker
    command: ["python", "-c", "import time; print('worker placeholder running'); time.sleep(3600)"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-halo}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── Postgres 18 ────────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: halo-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-halo}
    volumes:
      - halo_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d halo"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── Redis 8.8 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:8.8.0-alpine
    container_name: halo-redis
    expose:
      - "6379"
    volumes:
      - halo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  halo_caddy_data:
  halo_caddy_config:
  halo_pg_data:
  halo_redis_data:
