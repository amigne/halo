# Halo — CI workflow (T-160/T-161)
#
# Triggered on push and pull_request targeting the `dev` branch.
# Runs: lint, typecheck, tests (SQLite + Postgres 18 matrix),
# frontend build, dependency audit, and Docker dev smoke test.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  # ── Backend: lint + typecheck ──────────────────────────────────────────────
  lint-backend:
    name: Lint & typecheck (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy halo_api/ tests/

  # ── Frontend: lint + typecheck ────────────────────────────────────────────
  lint-frontend:
    name: Lint & typecheck (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  # ── Tests: SQLite + Postgres 18 matrix ─────────────────────────────────────
  test:
    name: Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: halotest
          POSTGRES_DB: halotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halotest"
          --health-interval 10s
          --health-timeout 3s
          --health-start-period 5s
          --health-retries 3
      redis:
        image: redis:8.8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-start-period 5s
          --health-retries 3
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:halotest@localhost:5432/halotest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest -v

  # ── Frontend build ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Dependency audit ──────────────────────────────────────────────────────
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Frontend ---
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (frontend)
        working-directory: src/frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      # --- Backend ---
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: uv lock check (backend)
        working-directory: src/backend
        run: uv lock --check

      - name: pip-audit (backend)
        working-directory: src/backend
        run: |
          uv run pip-audit 2>/dev/null || \
          uvx pip-audit 2>/dev/null || \
          echo "pip-audit not available — skipping"

  # ── Docker dev smoke test ──────────────────────────────────────────────────
  smoke-dev:
    name: Smoke test (Docker dev)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test, build-frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy env file
        run: cp .env.dev.example .env.dev

      - name: Build and start dev stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build --wait

      - name: Check backend health
        run: |
          curl -fsS --retry 5 --retry-delay 3 http://localhost:8000/api/v1/health
          curl -fsS --retry 5 --retry-delay 3 http://localhost:8000/api/v1/ready

      - name: Check frontend
        run: |
          curl -fsS --retry 5 --retry-delay 3 http://localhost:5173/

      - name: Check Mailpit
        run: |
          curl -fsS --retry 5 --retry-delay 3 http://localhost:8025/

      - name: Check Redis
        run: |
          docker exec halo-redis-dev redis-cli ping

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
